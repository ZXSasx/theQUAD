a{color:var(--em)}.uni summary{font-size:16px}td:first-child{min-width:0}

<header><div class="logo"><i></i>The Quad</div><div class="row" style="align-items:center"><span class="clock" id="clk"></span><button data-act="theme">change theme</button></div></header>
<nav id="nav"></nav><main id="app"></main><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SUBJ={ENG:'English',EAE:'English (ELD)',EWC:'Writer\u2019s Craft',ETS:'Studies in Literature',FSF:'Core French',FIF:'French Immersion',FEF:'Extended French',MHF:'Advanced Functions',MCV:'Calculus and Vectors',MCR:'Functions',MPM:'Principles of Math',MFM:'Foundations of Math',MDM:'Data Management',MCF:'Functions & Applications',MAP:'Applications of Math',SCH:'Chemistry',SPH:'Physics',SBI:'Biology',SES:'Earth & Space Science',SNC:'Science',SVN:'Environmental Science',ICS:'Computer Science',ICD:'Computer Studies',TEJ:'Computer Technology',TDJ:'Technological Design',TGJ:'Communications Tech',TPJ:'Manufacturing/Robotics',BBB:'International Business',BAT:'Accounting',BOH:'Business Leadership',CHY:'World History',CHW:'World History',CHI:'Canadian History',CGW:'World Issues',CIA:'Economics',CIE:'Economics',CPW:'Politics',HSB:'Challenge & Change',HZT:'Philosophy',HSP:'Anthropology/Psych/Soc',AVI:'Visual Arts',AMU:'Music',ADA:'Dance',ATC:'Theatre',PPL:'Healthy Active Living'};
const CAT={M:'Math',S:'Science',E:'English',F:'Languages',I:'Computer Science',T:'Technology',H:'Humanities',C:'Humanities',B:'Business',A:'Arts',P:'Health & PE'},CATS=[...new Set(Object.values(CAT)),'Other'];
const NM=[[/advanced func/,'MHF4U'],[/calc|vector/,'MCV4U'],[/data man/,'MDM4U'],[/chem/,'SCH4U'],[/phys/,'SPH4U'],[/bio/,'SBI4U'],[/comp.*sci|computer sci/,'ICS4U'],[/^english|eng lit/,'ENG4U'],[/earth/,'SES4U'],[/^functions?$/,'MCR3U']];
function parseCode(raw){const t=String(raw||'').toUpperCase().replace(/[^A-Z0-9]/g,''),m=t.match(/^([A-Z]{3})([1-4])([UMCOEDL])/);if(!m)return null;return{code:m[1]+m[2]+m[3],name:SUBJ[m[1]]||'Course '+m[1]+m[2]+m[3],cat:CAT[m[1][0]]||'Other',level:8+ +m[2],des:m[3],rec:true}}
function recog(inp){const raw=String(inp||'').trim(),p=parseCode(raw);if(p)return p;const l=raw.toLowerCase();for(const[re,c]of NM)if(re.test(l)){const q=parseCode(c);q.guess=true;return q}return{code:raw.toUpperCase(),name:raw,cat:'Other',level:null,des:null,rec:false}}
const isUM=g=>g.level===12&&(g.des==='U'||g.des==='M');
let S={page:'dash',grades:[],apps:[],data:[],f:{u:'',p:'',d:'',c:'',q:'',eng:false,sort:'avgD'},pg:1,msg:null,incl:true};
function load(){try{S.grades=JSON.parse(localStorage.getItem('tfc:grades')||'[]');S.apps=JSON.parse(localStorage.getItem('tfc:apps')||'[]');S.ev=JSON.parse(localStorage.getItem('tfc:events')||'[]');S.t6=JSON.parse(localStorage.getItem('tfc:t6')||'{"mode":"auto","ids":[]}');S.psel=JSON.parse(localStorage.getItem('tfc:psel')||'{}');const d=JSON.parse(localStorage.getItem('tfc:data')||'[]');S.data=d.map(a=>({uni:a[0],prog:a[1],code:a[2],dec:a[3],avg:a[4],raw:a[5],app:a[6],dd:a[7],grp:a[8],cit:a[9],prov:a[10],supp:a[11],sn:a[12],com:a[13],eng:/engineer|mechatronic|engsci/i.test(a[1]+' '+a[2])}));{const th=localStorage.getItem('tfc:theme');if(th==='d'||th==='dark')document.documentElement.dataset.theme='dark';else if(th==='l'||th==='light')document.documentElement.dataset.theme='light'}}catch(e){toast('Saved data could not be read.')}}
function save(k){try{const v=k==='data'?S.data.map(r=>[r.uni,r.prog,r.code,r.dec,r.avg,r.raw,r.app,r.dd,r.grp,r.cit,r.prov,r.supp,r.sn,r.com]):S[k];localStorage.setItem('tfc:'+(k==='ev'?'events':k),JSON.stringify(v));return true}catch(e){toast('Could not save \u2014 browser storage is full. Data stays until you close this tab.');return false}}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',4500)}
/* ---------- grades ---------- */
function top6Auto(){return eligible().sort((a,b)=>b.grade-a.grade).slice(0,6)}
function top6(){const el=S.grades.filter(g=>g.grade!=null&&isUM(g)&&(S.incl||g.status==='Completed')).sort((a,b)=>b.grade-a.grade);const T=S.t6||{mode:'auto',ids:[]},tid=(T.ids||[]).map(String),sel=T.mode==='custom'?el.filter(g=>tid.includes(String(g.id))):el.slice(0,6),ids=new Set(sel.map(g=>g.id));
const ex=S.grades.filter(g=>!ids.has(g.id)).map(g=>{let w;if(g.grade==null)w='No grade entered yet';else if(g.level!==12)w=g.level?'Grade '+g.level+' course \u2014 only Grade 12 counts':'Level unknown \u2014 tick \u201cGr 12 U/M\u201d if it is one';else if(!isUM(g))w='Grade 12 but designated '+g.des+' \u2014 only U/M count';else if(!S.incl&&g.status!=='Completed')w='In progress \u2014 excluded by your setting';else w=T.mode==='custom'?'Eligible, but not one of the 6 you chose':'Ranked #'+(el.indexOf(g)+1)+' \u2014 below your 6 highest';return{g,w}});
return{sel,ex,avg:sel.length?sel.reduce((a,g)=>a+g.grade,0)/sel.length:null,n:el.length}}
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null,f1=n=>n==null?'\u2014':(Math.round(n*10)/10)+'%';
function addCourse(inp,gr,st){const r=recog(inp);if(!r.code)return toast('Enter a course code or name.');const g=gr===''||isNaN(+gr)?null:Math.min(100,Math.max(0,+gr));S.grades.push({id:Date.now()+Math.random(),...r,grade:g,status:st});save('grades');render()}
function picker(sel,attr){const el=eligible().sort((a,b)=>b.grade-a.grade),ss=(sel||[]).map(String);
if(!el.length)return'<p class="note">No eligible Grade 12 U/M courses with grades yet. Add some on My Grades.</p>';
const pk=el.filter(g=>ss.includes(String(g.id)));
return`<div class="tw"><table>${el.map(g=>`<tr><td style="width:40px"><input type="checkbox" ${attr} data-id="${g.id}" ${ss.includes(String(g.id))?'checked':''}></td><td><b>${esc(g.code)}</b> ${esc(g.name)}</td><td>${g.grade}%</td></tr>`).join('')}</table></div><p class="note">${pk.length} of 6 chosen${pk.length?' \u00b7 average '+f1(mean(pk.map(g=>g.grade))):''}</p>`}
function pkPanel(p){const a=pAvg(p.req,p),on=!!(S.psel&&S.psel[p.id]);
return`<div class="pnl" style="margin:8px 0"><label><input type="checkbox" data-ch="pcustom" data-pid="${p.id}" ${on?'checked':''}> Use my own 6 courses for this program</label>
<p class="note">${on?'Tick up to 6. This program asks for '+esc(rq(p.req))+'.':'Default rule: '+esc(rq(p.req))+', then your best remaining Grade 12 U/M grades up to 6. Counting now: '+(a.pick.map(g=>esc(g.code)+' '+g.grade+'%').join(', ')||'nothing yet')+'.'}${p.note?' '+esc(p.note):''}</p>${on?picker(S.psel[p.id],`data-ch="psel" data-pid="${p.id}"`):''}</div>`}
function pGrades(){const t=top6(),cu=S.t6&&S.t6.mode==='custom',all=S.grades,done=all.filter(g=>g.status==='Completed').length;
const opt=(a,v)=>a.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('');
return`<h1>My Grades</h1><p class="sub">Enter a course code (ENG4U, MHF 4U, mcv4u-02\u2026) or just its name. Your grades are saved on this computer and used on every page.</p>
<div class="grid g4"><div class="pnl"><div class="ph">top 6 average</div><div class="big">${f1(t.avg)}</div><div class="bar"><i style="width:${t.sel.length/6*100}%"></i></div><div class="lb" style="margin-top:6px">${t.sel.length} of 6 Grade 12 U/M courses with grades</div></div>
<div class="pnl"><div class="ph">overall average</div><div class="big">${f1(mean(all.filter(g=>g.grade!=null).map(g=>g.grade)))}</div><div class="lb" style="margin-top:6px">${all.length} courses entered</div></div>
<div class="pnl"><div class="ph">completed</div><div class="big">${done}</div><div class="lb" style="margin-top:6px">courses finished</div></div>
<div class="pnl"><div class="ph">in progress</div><div class="big">${all.length-done}</div><div class="lb" style="margin-top:6px">courses underway</div></div></div>
<div class="pnl"><div class="ph">add a course</div><div class="row"><div><span class="lb">Code or name</span><input id="gc" placeholder="MHF4U" style="width:200px"></div><div><span class="lb">Grade %</span><input id="gg" type="number" min="0" max="100" step="0.1" style="width:90px"></div><div><span class="lb">Status</span><select id="gs"><option>Completed</option><option>In progress</option></select></div><button class="pri" data-act="addc">Add course</button></div></div>
<div class="pnl"><div class="ph"><span>how your top 6 is chosen</span><label><input type="checkbox" data-ch="incl" ${S.incl?'checked':''}> count in-progress courses</label></div>
<div class="row" style="margin:8px 0;gap:18px"><label><input type="radio" name="t6m" data-ch="t6mode" value="auto" ${!cu?'checked':''}> Automatic: my 6 highest</label><label><input type="radio" name="t6m" data-ch="t6mode" value="custom" ${cu?'checked':''}> I choose my own 6</label></div>
<p class="note" style="margin-top:0">${cu?'Tick up to 6 courses to count. ':''}This is your general Top 6. Schools do not all count the same courses, so you can also pick the 6 that count for each program on the Programs and My Applications pages.</p>

<div class="pnl"><div class="row"><div><span class="lb">University</span><select data-x="pfu">${uOpts(f.u,'All universities')}</select></div><div><span class="lb">Type</span><select data-x="pff"><option value="">All</option><option value="eng" ${f.f==='eng'?'selected':''}>Engineering</option><option value="com" ${f.f==='com'?'selected':''}>Commerce</option></select></div><div style="flex:1;min-width:200px"><span class="lb">Search</span><input id="pq" value="${esc(f.q)}" placeholder="Search a program" style="width:100%"></div><div><span class="lb">Sort</span><select data-x="pfs"><option value="comp" ${f.s==='comp'?'selected':''}>Most competitive first</option><option value="gap" ${f.s==='gap'?'selected':''}>Best fit for my grades</option><option value="uni" ${f.s==='uni'?'selected':''}>University A–Z</option></select></div></div>
${S.grades.length?`<p class="note">Your general Top 6 is ${f1(t.avg)}.</p>`:`<p class="msg" style="margin:12px 0 0">Add your courses on <button data-go="grades">My Grades</button> and your average appears next to every program.</p>`}${srcNote()}</div>
<div class="tw"><table><tr><th>Program</th><th>Your average</th><th>Minimum</th><th>Competitive</th><th>Status</th><th>Co-op</th><th></th></tr>${L.map(({p,a})=>{const st=pStat(p,a),has=S.apps.some(x=>x.pid===p.id);return`<tr><td><b>${esc(p.name)}</b><div class="note">${esc(p.uni)} · ${p.fac==='com'?'Commerce':'Engineering'}</div></td><td><b>${f1(a.avg)}</b>${a.custom?' <span class="tag wt">your 6</span>':''}${a.miss.length?`<div class="note no">${missTxt(a)}</div>`:''}</td><td>~${p.min}%</td><td>~${p.comp}%</td><td>${st[1]?`<span class="tag ${st[1]}">${esc(st[0])}</span>`:`<span class="note">${st[0]}</span>`}</td><td class="note">${esc(p.coop)}</td><td><div class="row">${has?'<span class="note">Added</span>':`<button data-do="addapp" data-pid="${p.id}">Add to applications</button>`}<button data-do="pk" data-k="progs:${p.id}">Courses</button></div></td></tr>${S.pk==='progs:'+p.id?`<tr><td colspan="7">${pkPanel(p)}</td></tr>`:''}`}).join('')||'<tr><td colspan="7" class="note">No programs match.</td></tr>'}</table></div>`}
/* ---------- compare ---------- */
function pCmp(){const P=S.cmp.map(c=>pById(c.p)),any=P.some(Boolean);
const row=(l,fn)=>`<tr><th>${l}</th>${P.map(p=>`<td>${p?fn(p):'<span class="note">—</span>'}</td>`).join('')}</tr>`;
return`<h1>Compare Programs</h1><p class="sub">Pick a university, then a program, in up to three slots.</p>
<div class="grid g4">${S.cmp.map((c,i)=>`<div class="pnl"><div class="ph">slot ${i+1}</div><div class="row"><div style="width:100%"><span class="lb">University</span><select style="width:100%" data-x="cu" data-i="${i}">${uOpts(c.u,'Choose a university')}</select></div><div style="width:100%"><span class="lb">Program</span><select style="width:100%" data-x="cp" data-i="${i}">${pOpts(c.u,c.p)}</select></div></div></div>`).join('')}</div>
${any?`<div class="tw"><table><tr><th></th>${P.map(p=>`<th>${p?esc(p.uns):''}</th>`).join('')}</tr>
${row('Program',p=>`<b>${esc(p.name)}</b>`)}${row('Description',p=>esc(p.desc))}${row('Minimum average',p=>'~'+p.min+'%')}${row('Competitive average',p=>'~'+p.comp+'%')}${row('Your average',p=>{const a=pAvg(p.req,p);return f1(a.avg)+(a.miss.length?`<div class="note no">${missTxt(a)}</div>`:'')})}${row('Status',p=>{const s=pStat(p);return`<span class="tag ${s[1]}">${esc(s[0])}</span>`})}${row('Co-op',p=>esc(p.coop))}${row('Required courses',p=>esc(rq(p.req)))}${row('Notes',p=>esc(p.note||'\u2014'))}${row('Supplementary application',p=>esc(p.supp))}${row('Official page',p=>`<a href="${p.url}" target="_blank" rel="noopener">Open</a>`)}</table></div>${srcNote()}`:'<div class="pnl"><p class="note">Choose a program in any slot to see the comparison.</p></div>'}`}
/* ---------- applications ---------- */
function pApps(){const A=S.apps.filter(a=>a.pid&&pById(a.pid)),leg=S.apps.length-A.length,na=S.na;
return`<h1>My Applications</h1><p class="sub">Pick a university and program, set the status, and the deadline shows on your calendar.</p>
<div class="pnl"><div class="ph">add an application</div><div class="row"><div><span class="lb">University</span><select data-x="nau">${uOpts(na.u,'Choose a university')}</select></div><div><span class="lb">Program</span><select data-x="nap">${pOpts(na.u,na.p)}</select></div><button class="pri" data-do="newapp">Add</button></div></div>
${A.length?`<div class="tw"><table><tr><th>Program</th><th>Status</th><th>Application deadline</th><th>Supplementary due</th><th>Your avg vs competitive</th><th></th></tr>${A.map(a=>{const p=pById(a.pid),av=pAvg(p.req,p),st=pStat(p,av);return`<tr><td><b>${esc(p.name)}</b><div class="note">${esc(p.uni)}</div></td><td><select data-x="ast" data-id="${a.id}">${PADS.map(s=>`<option ${s===a.status?'selected':''}>${s}</option>`).join('')}</select></td><td><input type="date" data-x="adl" data-id="${a.id}" value="${a.deadline||''}"></td><td><input type="date" data-x="asp" data-id="${a.id}" value="${a.supp||''}"></td><td>${f1(av.avg)} vs ~${p.comp}% ${st[1]?`<span class="tag ${st[1]}">${esc(st[0])}</span>`:''}</td><td><div class="row"><button data-do="pk" data-k="apps:${p.id}">Courses</button><button class="dng" data-do="delapp" data-id="${a.id}">Remove</button></div></td></tr>${S.pk==='apps:'+p.id?`<tr><td colspan="6">${pkPanel(p)}</td></tr>`:''}`}).join('')}</table></div><p class="note">The default deadline is the OUAC 101 date, Jan 15 2027 ${tg('c')}. Schools may set earlier or later dates, so edit it to match.</p>`:'<div class="pnl"><p class="note">No applications yet. Add one above or use “Add to applications” on the Programs page.</p></div>'}
${leg?`<p class="note">${leg} older saved application${leg>1?'s':''} from the previous site are kept but not shown, because they are not linked to a program here.</p>`:''}`}
/* ---------- calendar ---------- */
function pCal(){const{y,m}=S.cal,st=new Date(Date.UTC(y,m,1)).getUTCDay(),dim=new Date(Date.UTC(y,m+1,0)).getUTCDate(),ev=events(),mn=new Date(Date.UTC(y,m,1)).toLocaleString('en-CA',{month:'long',timeZone:'UTC'}),td=todayS();let cells='';
for(let i=0;i<st;i++)cells+='<div class="cd e"></div>';
for(let d=1;d<=dim;d++){const ds=y+'-'+pad2(m+1)+'-'+pad2(d),es=ev.filter(e=>e.d===ds);cells+=`<div class="cd ${ds===td?'today':''} ${ds===S.evd?'sel':''}" data-do="pickd" data-d="${ds}" role="button" tabindex="0" aria-label="Pick ${ds}"><span class="dn">${d}</span>${es.map(e=>`<div class="ev ${e.k}" title="${esc(e.t)}">${esc(e.t)}</div>`).join('')}</div>`}
const up=ev.filter(e=>dleft(e.d)>=-0);
return`<h1>Calendar</h1><p class="sub">Deadlines come from the dates you set in My Applications, so the two always match.</p>
<div class="pnl"><div class="ph"><span>${mn.toLowerCase()} ${y}</span><span class="row"><button data-do="cprev">Prev</button><button data-do="cnext">Next</button><button data-do="ctoday">Today</button></span></div><div class="tw"><div class="cg"><div class="ch">Sun</div><div class="ch">Mon</div><div class="ch">Tue</div><div class="ch">Wed</div><div class="ch">Thu</div><div class="ch">Fri</div><div class="ch">Sat</div>${cells}</div></div></div>
<div class="pnl"><div class="ph">Add your own event</div><div class="row"><div style="flex:1;min-width:200px"><span class="lb">What is it?</span><input id="evt" placeholder="Campus tour, scholarship due, call with advisor" style="width:100%"></div><div class="pick"><span class="lb">Date</span><b>${new Date(ud(S.evd)).toLocaleDateString('en-CA',{weekday:'short',month:'short',day:'numeric',year:'numeric',timeZone:'UTC'})}</b><input id="evd" type="date" value="${S.evd}" data-x="evd"></div><button class="pri" data-do="addev">Add event</button></div><p class="note" style="margin:10px 0 0">Click any day on the calendar above to choose its date.</p></div>
<div class="pnl"><div class="ph">upcoming deadlines</div><div class="tw"><table><tr><th>Date</th><th>Event</th><th>Days left</th><th>Sync</th></tr>${up.map(e=>`<tr><td>${e.d}</td><td>${esc(e.t)}${e.k==='ouac'?' '+tg('c'):''}</td><td>${dleft(e.d)}</td><td><a href="${gcal(e)}" target="_blank" rel="noopener">Add to Google Calendar</a>${e.k==='custom'?` <button class="dng" data-do="delev" data-id="${e.id}">Remove</button>`:''}</td></tr>`).join('')||'<tr><td colspan="4" class="note">No upcoming deadlines.</td></tr>'}</table></div>
<div class="row" style="margin-top:12px"><button data-do="mkics">Show calendar file (.ics) text</button></div>${S.ics?`<p class="note">Copy this text, save it as <b>deadlines.ics</b>, and import it into Apple Calendar, Outlook or Google Calendar.</p><textarea id="icsbox" rows="6" readonly style="width:100%;font:12px 'JetBrains Mono',monospace;background:var(--pn);color:var(--ink);border:1px solid var(--ln);border-radius:8px">${esc(S.ics)}</textarea><button data-do="copy" data-src="icsbox">Copy</button>`:''}</div>`}
/* ---------- dashboard ---------- */
function pDash(){const t=top6(),ev=events().filter(e=>dleft(e.d)>=0),nx=ev[0],A=S.apps.filter(a=>a.pid&&pById(a.pid)),ok=PROGS.filter(p=>{const a=pAvg(p.req,p);return a.avg!=null&&!a.miss.length&&a.n>=6&&a.avg>=p.comp}).length;
const by={};A.forEach(a=>by[a.status]=(by[a.status]||0)+1);
return`<h1>Stay organized. Know your options. Meet your deadlines.</h1><p class="sub">Your admissions command centre. Everything here is built from the grades and applications you enter.</p>
<div class="grid g4"><div class="pnl"><div class="ph">next deadline</div><div class="big">${nx?dleft(nx.d):'—'}</div><div class="lb" style="margin-top:6px">${nx?'days: '+esc(nx.t):'No deadlines yet'}</div></div>
<div class="pnl"><div class="ph">top 6</div><div class="big">${f1(t.avg)}</div><div class="bar"><i style="width:${t.sel.length/6*100}%"></i></div><div class="lb" style="margin-top:6px">${t.sel.length} of 6 courses</div></div>
<div class="pnl"><div class="ph">applications</div><div class="big">${A.length}</div><div class="lb" style="margin-top:6px">${Object.entries(by).map(([k,v])=>v+' '+k.toLowerCase()).join(' · ')||'None yet'}</div></div>
<div class="pnl"><div class="ph">programs in reach</div><div class="big">${ok}</div><div class="lb" style="margin-top:6px">of ${PROGS.length} at or above competitive average</div></div></div>
<div class="pnl"><div class="ph">coming up</div>${ev.slice(0,5).map(e=>`<div class="row" style="justify-content:space-between;border-top:1px solid var(--sg);padding:8px 0"><span>${esc(e.t)}</span><span class="lb">${e.d} · ${dleft(e.d)} days</span></div>`).join('')||'<p class="note">Nothing scheduled.</p>'}</div>
<div class="row"><button class="pri" data-go="grades">Enter grades</button><button data-go="progs">See programs</button><button data-go="apps">My applications</button><button data-go="data">Browse application data</button></div>`}
/* ---------- new handlers ---------- */
function sure(t){if(t.dataset.armed)return true;t.dataset.armed=1;const o=t.textContent;t.textContent='Click again to confirm';setTimeout(()=>{if(t.isConnected){delete t.dataset.armed;t.textContent=o}},3500);return false}
document.addEventListener('click',e=>{const t=e.target.closest('[data-do]');if(!t)return;const a=t.dataset.do;
if(a==='pk'){S.pk=S.pk===t.dataset.k?'':t.dataset.k;render();return}
if(a==='addapp'){const p=pById(t.dataset.pid);if(p&&!S.apps.some(x=>x.pid===p.id)){S.apps.push({id:Date.now()+Math.random(),pid:p.id,status:'Planning',deadline:OUAC,supp:''});save('apps');toast(p.name+' added to My Applications.')}render()}
else if(a==='newapp'){if(!S.na.p)return toast('Choose a university and a program first.');if(!S.apps.some(x=>x.pid===S.na.p)){S.apps.push({id:Date.now()+Math.random(),pid:S.na.p,status:'Planning',deadline:OUAC,supp:''});save('apps')}S.na={u:'',p:''};render()}
else if(a==='delapp'){if(sure(t)){S.apps=S.apps.filter(x=>String(x.id)!==t.dataset.id);save('apps');render()}}
else if(a==='cprev'||a==='cnext'){const c=S.cal;c.m+=a==='cnext'?1:-1;if(c.m<0){c.m=11;c.y--}if(c.m>11){c.m=0;c.y++}render()}
else if(a==='ctoday'){const x=todayS();S.cal={y:+x.slice(0,4),m:+x.slice(5,7)-1};render()}
else if(a==='pickd'){const keep=($('#evt')||{}).value||'';S.evd=t.dataset.d;render();$('#evt').value=keep;const i=$('#evt');if(i)i.focus()}
else if(a==='addev'){const tt=$('#evt').value.trim(),dd=S.evd;if(!tt||!dd)return toast('Enter what the event is and its date.');S.ev.push({id:Date.now()+Math.random(),t:tt,d:dd});save('ev');const c=S.cal;c.y=+dd.slice(0,4);c.m=+dd.slice(5,7)-1;render()}
else if(a==='delev'){if(sure(t)){S.ev=S.ev.filter(x=>String(x.id)!==t.dataset.id);save('ev');render()}}
else if(a==='mkics'){S.ics=ics();render()}
else if(a==='copy'){const b=document.getElementById(t.dataset.src);b.select();(navigator.clipboard?navigator.clipboard.writeText(b.value):Promise.reject()).then(()=>toast('Copied.')).catch(()=>toast('Select the text and copy it with Ctrl+C.'))}});
document.addEventListener('change',e=>{const t=e.target.closest('[data-x]');if(!t)return;const x=t.dataset.x,v=t.value,i=+t.dataset.i,ap=S.apps.find(a=>String(a.id)===t.dataset.id);
if(x==='evd'){if(v){S.evd=v;S.cal={y:+v.slice(0,4),m:+v.slice(5,7)-1}}}else if(x==='pfu')S.pf.u=v;else if(x==='pfs')S.pf.s=v;else if(x==='pff')S.pf.f=v;else if(x==='uff')S.uf=v;else if(x==='cu')S.cmp[i]={u:v,p:''};else if(x==='cp')S.cmp[i].p=v;else if(x==='nau')S.na={u:v,p:''};else if(x==='nap')S.na.p=v;
else if(ap){if(x==='ast')ap.status=v;else if(x==='adl')ap.deadline=v;else if(x==='asp')ap.supp=v;save('apps')}
render()});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.cd[data-do]')){e.preventDefault();e.target.click()}});
document.addEventListener('input',e=>{const t=e.target;if(t.id!=='uq'&&t.id!=='pq')return;if(t.id==='uq')S.uq=t.value;else S.pf.q=t.value;render();const n=document.getElementById(t.id);n.focus();n.setSelectionRange(n.value.length,n.value.length)});

S.evd=todayS();
load();render();(function k(){$('#clk').textContent='Toronto '+new Intl.DateTimeFormat('en-CA',{timeZone:'America/Toronto',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date());setTimeout(k,30000)})();
</script>
</body></html>
